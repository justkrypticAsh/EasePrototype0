name: EasePrototype0
options:
  bundleIdPrefix: com.ease
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  EasePrototype0:
    type: application
    platform: iOS
    sources:
      - ios/EasePrototype0
    info:
      path: ios/EasePrototype0/App/Info.plist
      properties:
        CFBundleDisplayName: "EASE"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "EASE requires microphone access to record in-person project discussions with participant consent."
        NSSpeechRecognitionUsageDescription: "EASE uses speech processing to support on-device audio briefing and voice enrollment."
        NSCalendarsUsageDescription: "EASE allows exporting project decisions and follow-ups to Apple Calendar."
        NSRemindersFullAccessUsageDescription: "EASE allows exporting assigned action items directly to Apple Reminders."
        UIBackgroundModes:
          - audio
          - processing
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ease.EasePrototype0
      TARGETED_DEVICE_FAMILY: "1"

  EaseWatch:
    type: application
    platform: watchOS
    sources:
      - ios/EaseWatch
    info:
      path: ios/EaseWatch/Info.plist
      properties:
        CFBundleDisplayName: "EASE Remote"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WKCompanionAppBundleIdentifier: com.ease.EasePrototype0
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ease.EasePrototype0.watch
      TARGETED_DEVICE_FAMILY: "4"

  EaseWidget:
    type: app-extension
    platform: iOS
    sources:
      - ios/EaseWidget
    info:
      path: ios/EaseWidget/Info.plist
      properties:
        CFBundleDisplayName: "EASE Brief"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ease.EasePrototype0.widget
      TARGETED_DEVICE_FAMILY: "1"
