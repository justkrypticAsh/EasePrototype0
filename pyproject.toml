[project]
name = "ease-prototype"
version = "0.1.0"
description = "EASE: In-person project discussion capture, accurate speaker diarization, cross-discussion memory, and team collaboration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.0.28",
    "greenlet>=3.0.0",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.2",
    "cryptography>=42.0.5",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
